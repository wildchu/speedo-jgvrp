<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Luxury Cockpit Analog Speedometer JG:VRP</title>
  
  <!-- Google Fonts: Rajdhani & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.6);
      --orange: #ff9d00;
      --orange-glow: rgba(255, 157, 0, 0.6);
      --red: #ff2a55;
      --red-glow: rgba(255, 42, 85, 0.7);
      --green: #00ff88;
      --green-glow: rgba(0, 255, 136, 0.7);
      --blue: #1a8cff;
      --bg-dial: rgba(8, 12, 20, 0.88);
      --border-dial: rgba(0, 240, 255, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      width: 100vw;
    }

    /* === HUD CONTAINER (Pojok Kanan Bawah) === */
    .hud-wrapper {
      position: absolute;
      bottom: 25px;
      right: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.85));
    }

    /* === SPEEDOMETER ANALOG DIAL CLUSTER === */
    .dial-container {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--bg-dial);
      border: 1.5px solid var(--border-dial);
      box-shadow: 
        0 0 25px rgba(0, 240, 255, 0.2), 
        inset 0 0 50px rgba(0, 0, 0, 0.95),
        inset 0 0 16px rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .gauge-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Outer Ring Bezel & Ticks */
    .dial-outer-border {
      fill: none;
      stroke: rgba(0, 240, 255, 0.24);
      stroke-width: 1.5;
      stroke-dasharray: 4 3;
    }

    .dial-inner-ring {
      fill: none;
      stroke: rgba(0, 240, 255, 0.12);
      stroke-width: 1;
    }

    /* Speed Arc Track & Dynamic Glowing Fill */
    .speed-arc-track {
      fill: none;
      stroke: rgba(0, 240, 255, 0.1);
      stroke-width: 3.5;
      stroke-linecap: round;
    }

    .speed-arc-fill {
      fill: none;
      stroke: url(#speedArcGrad);
      stroke-width: 4.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px #00f0ff);
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.08s linear;
    }

    /* RPM Arc Track & Fill */
    .rpm-arc-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .rpm-arc-fill {
      fill: none;
      stroke: #00f0ff;
      stroke-width: 3;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px #00f0ff);
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.08s linear, stroke 0.2s, filter 0.2s;
    }

    /* Radial Arc Gauges: Health (Kiri) & Fuel (Kanan) */
    .side-arc-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .health-arc-fill {
      fill: none;
      stroke: #00f0ff;
      stroke-width: 3.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px #00f0ff);
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.15s ease-out, stroke 0.3s, filter 0.3s;
    }

    .fuel-arc-fill {
      fill: none;
      stroke: #ff9d00;
      stroke-width: 3.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px #ff9d00);
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.15s ease-out, stroke 0.3s, filter 0.3s;
    }

    /* SVG Ticks */
    .tick-major {
      stroke: #00f0ff;
      stroke-width: 2;
      filter: drop-shadow(0 0 3px #00f0ff);
    }

    .tick-minor {
      stroke: rgba(0, 240, 255, 0.32);
      stroke-width: 1;
    }

    .tick-red {
      stroke: #ff2a55;
      filter: drop-shadow(0 0 4px #ff2a55);
    }

    /* Speed Digits Melingkar */
    .gauge-num {
      fill: #00f0ff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.6));
    }

    .num-red {
      fill: #ff2a55;
      filter: drop-shadow(0 0 4px rgba(255, 42, 85, 0.8));
    }

    /* Lampu Sein Atas (Dekat angka 80 dan 120) */
    .svg-turn-ico {
      transition: fill 0.2s, filter 0.2s;
    }

    .indicator-shape {
      fill: rgba(255, 255, 255, 0.18);
      transition: fill 0.2s, filter 0.2s;
    }

    .svg-turn-ico.blinking .indicator-shape {
      animation: blink-indicator 0.5s infinite alternate ease-in-out;
      fill: #00ff88 !important;
      filter: drop-shadow(0 0 10px #00ff88) !important;
    }

    @keyframes blink-indicator {
      0% { opacity: 0.12; }
      100% { opacity: 1; }
    }

    /* Jarum Analog (Needle) */
    #needle {
      transform-box: view-box;
      transform-origin: 150px 150px;
      transform: rotate(-135deg);
      transition: transform 0.08s cubic-bezier(0.12, 0.82, 0.32, 1);
      will-change: transform;
    }

    /* === 1. KUADRAN ATAS TENGAH: TEKS DIGITAL SPEED & UNIT === */
    .speed-cluster {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 6;
    }

    .speed-cluster .speed-val {
      font-size: 48px;
      font-weight: 700;
      line-height: 0.82;
      color: #00f0ff;
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.9), 0 0 32px rgba(0, 240, 255, 0.4);
      letter-spacing: -1px;
    }

    .speed-cluster .unit-val {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #00f0ff;
      margin-top: 4px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    /* === 2. RADIAL ARC TEXT LABELS (MINIMALIS TRANSPARAN) === */
    .arc-text-badge {
      position: absolute;
      top: 198px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      pointer-events: none;
      z-index: 6;
      font-family: 'Share Tech Mono', 'Rajdhani', sans-serif;
    }

    .arc-text-hp {
      left: 54px;
      color: #00f0ff;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.6);
    }

    .arc-text-fuel {
      right: 54px;
      color: #ff9d00;
      text-shadow: 0 0 6px rgba(255, 157, 0, 0.6);
    }

    /* === 3 & 4. BAGIAN BAWAH: STATUS ICONS, GEAR, ODOMETER === */
    .lower-cockpit {
      position: absolute;
      bottom: 22px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 6;
    }

    /* Baris Ikon Status Sejajar Horizontal */
    .status-row-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .status-mini-ico {
      width: 15px;
      height: 15px;
      fill: rgba(255, 255, 255, 0.18);
      transition: fill 0.2s, filter 0.2s, opacity 0.2s;
    }

    .status-mini-ico.fill-cyan {
      fill: #00f0ff !important;
      filter: drop-shadow(0 0 8px #00f0ff);
    }

    .status-mini-ico.fill-blue {
      fill: #1a8cff !important;
      filter: drop-shadow(0 0 8px #1a8cff);
    }

    .status-mini-ico.fill-green {
      fill: #00ff88 !important;
      filter: drop-shadow(0 0 8px #00ff88);
    }

    .status-mini-ico.fill-red {
      fill: #ff3344 !important;
      filter: drop-shadow(0 0 8px #ff3344);
    }

    /* Badge Gear Minimalis */
    .gear-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 9px;
      background: rgba(255, 157, 0, 0.08);
      border: 1px solid rgba(255, 157, 0, 0.45);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(255, 157, 0, 0.25);
    }

    .gear-val {
      font-size: 13px;
      font-weight: 700;
      color: #ff9d00;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 157, 0, 0.7);
    }

    /* Segmen Bar RPM Kompak */
    .segments {
      display: flex;
      gap: 3px;
    }

    .seg {
      width: 6px;
      height: 4px;
      border-radius: 1px;
      background: rgba(0, 240, 255, 0.15);
      transition: background 0.08s, box-shadow 0.08s;
    }

    .seg.active {
      background: #00f0ff;
      box-shadow: 0 0 6px #00f0ff;
    }

    .seg:nth-child(n+7).active {
      background: #ff2a55;
      box-shadow: 0 0 6px #ff2a55;
    }

    /* Odometer Bersih Tanpa Box Berlebihan */
    .odometer-display {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 1px;
    }

    .odometer-display .odo-unit {
      font-size: 10px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 0.5px;
    }

    /* === INTERACTIVE DEMO CONTROLLER (Testing di browser) === */
    .demo-toggle-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(12, 19, 32, 0.85);
      border: 1px solid var(--border-dial);
      color: var(--cyan);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 9999;
      opacity: 0.35;
      transition: opacity 0.25s, transform 0.2s, box-shadow 0.25s;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .demo-toggle-btn:hover {
      opacity: 1;
      transform: translateY(-1px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    .demo-panel {
      position: fixed;
      top: 55px;
      left: 15px;
      background: rgba(8, 14, 24, 0.94);
      border: 1px solid var(--border-dial);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      z-index: 9998;
      width: 290px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .demo-panel.show {
      display: flex;
    }

    .demo-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 6px;
    }

    .demo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 10px;
    }

    .demo-row input[type="range"] {
      flex: 1;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .demo-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .demo-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 11px;
      padding: 5px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--cyan);
    }

    .demo-btn.active {
      background: var(--cyan);
      color: #080e18;
      box-shadow: 0 0 8px var(--cyan);
    }
  </style>
</head>
<body>

  <!-- HUD WRAPPER (Pojok Kanan Bawah) -->
  <div class="hud-wrapper">
    <!-- Speedometer Analog Dial Cluster (Clean Luxury Cockpit) -->
    <div class="dial-container">
      <svg class="gauge-svg" viewBox="0 0 300 300">
        <defs>
          <!-- Radial Gradient Latar Dial -->
          <radialGradient id="dialBgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0e1724" stop-opacity="0.96" />
            <stop offset="70%" stop-color="#080e18" stop-opacity="0.94" />
            <stop offset="100%" stop-color="#04070d" stop-opacity="0.98" />
          </radialGradient>

          <!-- Gradient Jarum Neon -->
          <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="30%" stop-color="#ff3366" />
            <stop offset="85%" stop-color="#ff0033" />
            <stop offset="100%" stop-color="#b30024" />
          </linearGradient>

          <!-- Gradient Dynamic Speed Arc -->
          <linearGradient id="speedArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="65%" stop-color="#00f0ff" />
            <stop offset="85%" stop-color="#ff9d00" />
            <stop offset="100%" stop-color="#ff2a55" />
          </linearGradient>

          <!-- Glow Filter Jarum -->
          <filter id="needleGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#ff2a55" flood-opacity="0.85" />
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff0033" flood-opacity="0.45" />
          </filter>

          <!-- Glow Filter Hub Tengah -->
          <filter id="hubGlow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.5" />
          </filter>
        </defs>

        <!-- Latar Belakang & Ring Bezel -->
        <circle cx="150" cy="150" r="146" class="dial-outer-border" />
        <circle cx="150" cy="150" r="142" fill="url(#dialBgGrad)" />
        <circle cx="150" cy="150" r="132" class="dial-inner-ring" />

        <!-- Track & Dynamic Arc Kecepatan Utama (0 - 200) -->
        <path d="M 60.90 239.10 A 126 126 0 1 1 239.10 239.10" class="speed-arc-track" />
        <path id="speed-arc-fill" d="M 60.90 239.10 A 126 126 0 1 1 239.10 239.10" class="speed-arc-fill" pathLength="100" />

        <!-- Track & Dynamic Arc RPM -->
        <path d="M 96.26 203.74 A 76 76 0 1 1 203.74 203.74" class="rpm-arc-track" />
        <path id="rpm-arc-fill" d="M 96.26 203.74 A 76 76 0 1 1 203.74 203.74" class="rpm-arc-fill" pathLength="100" />

        <!-- 2. INTEGRASI RADIAL ARC GAUGE HP (KIRI) & FUEL (KANAN) -->
        <!-- Health Arc Gauge (Left Flank) -->
        <path d="M 76.3 201.6 A 90 90 0 0 1 76.3 98.4" class="side-arc-track" />
        <path id="health-arc-bar" d="M 76.3 201.6 A 90 90 0 0 1 76.3 98.4" class="health-arc-fill" pathLength="100" />

        <!-- Fuel Arc Gauge (Right Flank) -->
        <path d="M 223.7 201.6 A 90 90 0 0 0 223.7 98.4" class="side-arc-track" />
        <path id="fuel-arc-bar" d="M 223.7 201.6 A 90 90 0 0 0 223.7 98.4" class="fuel-arc-fill" pathLength="100" />

        <!-- Garis Ukur (Ticks) & Angka Speedometer -->
        <g id="gauge-ticks"></g>
        <g id="gauge-labels"></g>

        <!-- 3. LAMPU SEIN ATAS SAMPING (Kiri dekat angka 80, Kanan dekat angka 120) -->
        <!-- Sen Kiri (Dekat Angka 80) -->
        <g id="ico-sen-left" class="svg-turn-ico" transform="translate(86, 60)">
          <polygon points="11,0 2,6 11,12 11,8 16,8 16,4 11,4" class="indicator-shape" />
        </g>

        <!-- Sen Kanan (Dekat Angka 120) -->
        <g id="ico-sen-right" class="svg-turn-ico" transform="translate(198, 60)">
          <polygon points="5,0 14,6 5,12 5,8 0,8 0,4 5,4" class="indicator-shape" />
        </g>

        <!-- Jarum Analog (Needle) -->
        <g id="needle">
          <!-- Bilah Jarum -->
          <polygon points="146,155 147.5,45 150,22 152.5,45 154,155" fill="url(#needleGrad)" filter="url(#needleGlow)" />
          <!-- Sinar Inti Putih Jarum -->
          <line x1="150" y1="28" x2="150" y2="150" stroke="#ffffff" stroke-width="1.5" opacity="0.95" />
          <!-- Ekor Jarum -->
          <polygon points="147.5,150 148,168 152,168 152.5,150" fill="#ff2a55" opacity="0.75" />
          <!-- Hub Pivot Tengah (R=12, Kompak & Elegan) -->
          <circle cx="150" cy="150" r="12" fill="#0b121e" stroke="#00f0ff" stroke-width="1.8" filter="url(#hubGlow)" />
          <circle cx="150" cy="150" r="7.5" fill="#142132" stroke="#ff2a55" stroke-width="1.2" />
          <circle cx="150" cy="150" r="3" fill="#00f0ff" />
        </g>
      </svg>

      <!-- 1. KUADRAN ATAS TENGAH: TEKS DIGITAL SPEED & UNIT (MPH) -->
      <div class="speed-cluster">
        <div class="speed-val" id="speed">0</div>
        <div class="unit-val" id="unit-label">MPH</div>
      </div>

      <!-- 2. TEKS RADIAL ARC STATUS (HP & GAS MINIMALIS) -->
      <div class="arc-text-badge arc-text-hp">HP <span id="health-val">100%</span></div>
      <div class="arc-text-badge arc-text-fuel">GAS <span id="fuel-val">85%</span></div>

      <!-- Kompatibilitas Template JG:VRP (Elemen Tersembunyi Jika Dibutuhkan Script Eksternal) -->
      <div id="health-bar" style="display:none;"></div>
      <div id="fuel-bar" style="display:none;"></div>

      <!-- 3 & 4. BAGIAN BAWAH CLUSTER: STATUS ICONS, GEAR, ODOMETER -->
      <div class="lower-cockpit">
        <!-- Ikon Seatbelt, Headlights, Engine Sejajar Rapi di Atas GEAR -->
        <div class="status-row-center">
          <!-- Engine Status -->
          <svg class="status-mini-ico" id="ico-engine" viewBox="0 0 24 24">
            <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-2.42 1.08-4.6 2.79-6.07l-1.4-1.42A9.914 9.914 0 0 0 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-2.84-1.19-5.4-3.17-6.83z"/>
          </svg>

          <!-- Headlights -->
          <svg class="status-mini-ico" id="ico-lights" viewBox="0 0 24 24">
            <path d="M12 2C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm-2 18h4v1h-4v-1zm-1 3h6v1H9v-1z"/>
          </svg>

          <!-- Seatbelt Warning -->
          <svg class="status-mini-ico" id="ico-seatbelt" viewBox="0 0 24 24">
            <path d="M16 3H8C6.9 3 6 3.9 6 5v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 4.5l-3.5 3.5 3.5 3.5V16l-5-5 5-5v1.5z"/>
          </svg>
        </div>

        <!-- Gear Badge Minimalis -->
        <div class="gear-badge">
          <span class="gear-val" id="gear-label">GEAR 1</span>
        </div>

        <!-- Segmen Bar RPM Kompak (Kompatibilitas Template) -->
        <div class="segments" id="seg-wrapper">
          <div class="seg"></div>
          <div class="seg"></div>
          <div class="seg"></div>
          <div class="seg"></div>
          <div class="seg"></div>
          <div class="seg"></div>
          <div class="seg"></div>
          <div class="seg"></div>
        </div>

        <!-- Odometer Angka Digital Bersih Tanpa Box -->
        <div class="odometer-display">
          <span id="odometer">142.5</span>
          <span class="odo-unit" id="odo-unit">MI</span>
        </div>
      </div>
    </div>
  </div>

  <!-- INTERACTIVE DEMO CONTROLLER (Testing di browser) -->
  <button class="demo-toggle-btn" id="demo-toggle-btn" onclick="toggleDemoPanel()">⚡ DEMO HUD</button>
  <div class="demo-panel" id="demo-panel">
    <div class="demo-title">
      <span>CYBER SPEEDO TEST PANEL</span>
      <span style="cursor:pointer; color:#ff3344;" onclick="toggleDemoPanel()">✖</span>
    </div>
    
    <div class="demo-row">
      <span style="width: 50px;">Speed:</span>
      <input type="range" min="0" max="89.4" step="0.5" value="0" id="range-speed" oninput="onSpeedSlider(this.value)">
      <span id="demo-speed-val" style="width: 45px; text-align:right;">0 m/s</span>
    </div>

    <div class="demo-row">
      <span style="width: 50px;">RPM:</span>
      <input type="range" min="0" max="1" step="0.01" value="0" id="range-rpm" oninput="setRPM(parseFloat(this.value))">
    </div>

    <div class="demo-row">
      <span style="width: 50px;">Health:</span>
      <input type="range" min="0" max="1" step="0.01" value="1" id="range-health" oninput="setHealth(parseFloat(this.value))">
    </div>

    <div class="demo-row">
      <span style="width: 50px;">Fuel:</span>
      <input type="range" min="0" max="1" step="0.01" value="1" id="range-fuel" oninput="setFuel(parseFloat(this.value))">
    </div>

    <div class="demo-btn-grid">
      <button class="demo-btn" onclick="toggleEngineTest()">Engine</button>
      <button class="demo-btn" onclick="cycleLightTest()">Lights</button>
      <button class="demo-btn" onclick="toggleBeltTest()">Seatbelt</button>
      <button class="demo-btn" onclick="toggleLeftTest()">Sen Kiri</button>
      <button class="demo-btn" onclick="toggleRightTest()">Sen Kanan</button>
      <button class="demo-btn" onclick="cycleGearTest()">Gear</button>
      <button class="demo-btn" onclick="cycleUnitTest()">Unit</button>
      <button class="demo-btn" style="grid-column: span 2;" id="btn-auto-sim" onclick="toggleAutoDrive()">▶ Auto Drive</button>
    </div>
  </div>

  <script>
    // === KONFIGURASI GLOBAL & STATE JG:VRP ===
    let speedMode = 1; // 0: KMH, 1: MPH, 2: Knots

    // === GENERATE GARIS UKUR (TICKS) & ANGKA MELINGKAR SECARA PRESISI ===
    function initDialTicks() {
      const ticksGroup = document.getElementById('gauge-ticks');
      const labelsGroup = document.getElementById('gauge-labels');
      if (!ticksGroup || !labelsGroup) return;

      const cx = 150, cy = 150;
      const rOuter = 126;
      const rMajorInner = 114;
      const rMinorInner = 120;
      const rText = 98;

      // Rentang angka dari 0 hingga 200 (setiap 10 tick, setiap 20 major tick + angka)
      for (let s = 0; s <= 200; s += 10) {
        const isMajor = (s % 20 === 0);
        // Sudut sweep: 0 speed = -135deg, 200 speed = +135deg (Total sweep = 270 derajat)
        const angleDeg = -135 + (s / 200) * 270;
        const rad = (angleDeg - 90) * (Math.PI / 180);

        const x1 = cx + rOuter * Math.cos(rad);
        const y1 = cy + rOuter * Math.sin(rad);
        const rInner = isMajor ? rMajorInner : rMinorInner;
        const x2 = cx + rInner * Math.cos(rad);
        const y2 = cy + rInner * Math.sin(rad);

        // Garis Ukur (Tick)
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1.toFixed(2));
        line.setAttribute('y1', y1.toFixed(2));
        line.setAttribute('x2', x2.toFixed(2));
        line.setAttribute('y2', y2.toFixed(2));
        line.setAttribute('class', isMajor ? (s >= 160 ? 'tick-major tick-red' : 'tick-major') : 'tick-minor');
        ticksGroup.appendChild(line);

        // Angka Kecepatan Melingkar
        if (isMajor) {
          const tx = cx + rText * Math.cos(rad);
          const ty = cy + rText * Math.sin(rad);
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', tx.toFixed(2));
          text.setAttribute('y', (ty + 1).toFixed(2));
          text.setAttribute('class', s >= 160 ? 'gauge-num num-red' : 'gauge-num');
          text.textContent = s;
          labelsGroup.appendChild(text);
        }
      }
    }

    // Inisialisasi Ticks saat dokumen siap
    initDialTicks();


    // ==============================================================
    // === FUNGSI-FUNGSI GLOBAL RESMI SESUAI TEMPLATE JG:VRP ========
    // ==============================================================

    /**
     * Mengatur satuan kecepatan
     * @param {number} mode (0: KMH, 1: MPH, 2: Knots)
     */
    function setSpeedMode(mode) {
      speedMode = mode;
      const unitEl = document.getElementById('unit-label');
      const odoUnitEl = document.getElementById('odo-unit');
      switch(mode) {
        case 1:
          if (unitEl) unitEl.innerText = 'MPH';
          if (odoUnitEl) odoUnitEl.innerText = 'MI';
          break;
        case 2:
          if (unitEl) unitEl.innerText = 'KNOTS';
          if (odoUnitEl) odoUnitEl.innerText = 'KN';
          break;
        default:
          if (unitEl) unitEl.innerText = 'KMH';
          if (odoUnitEl) odoUnitEl.innerText = 'KM';
      }
    }

    /**
     * Menerima kecepatan m/s dari game, mengonversi ke satuan aktif,
     * serta memutar jarum analog (-135deg s/d +135deg).
     * @param {number} speed (kecepatan m/s)
     */
    function setSpeed(speed) {
      let finalSpeed = 0;
      switch(speedMode) {
        case 1: finalSpeed = Math.round(speed * 2.236936); break;
        case 2: finalSpeed = Math.round(speed * 1.943844); break;
        default: finalSpeed = Math.round(speed * 3.6);
      }

      // Update Angka Digital
      const speedEl = document.getElementById('speed');
      if (speedEl) speedEl.innerText = finalSpeed;

      // Putar Jarum Analog (-135deg pada 0, +135deg pada 200)
      const maxScale = 200;
      const clampedSpeed = Math.max(0, Math.min(finalSpeed, 220));
      const angle = -135 + (clampedSpeed / maxScale) * 270;

      const needle = document.getElementById('needle');
      if (needle) {
        needle.style.transform = `rotate(${angle}deg)`;
        needle.setAttribute('transform', `rotate(${angle}, 150, 150)`);
      }

      // Dynamic Speed Arc Fill (0 s/d 100)
      const speedArc = document.getElementById('speed-arc-fill');
      if (speedArc) {
        const progress = Math.min(1, Math.max(0, finalSpeed / maxScale));
        speedArc.style.strokeDashoffset = (100 * (1 - progress)).toFixed(2);
      }
    }

    /**
     * Mengatur putaran mesin / RPM
     * @param {number} rpm (0.0 sampai 1.0)
     */
    function setRPM(rpm) {
      const clampedRpm = Math.max(0, Math.min(1, Number(rpm) || 0));

      // 1. Arc Analog RPM pada Dial
      const rpmArc = document.getElementById('rpm-arc-fill');
      if (rpmArc) {
        rpmArc.style.strokeDashoffset = (100 * (1 - clampedRpm)).toFixed(2);
        if (clampedRpm > 0.85) {
          rpmArc.style.stroke = '#ff2a55';
          rpmArc.style.filter = 'drop-shadow(0 0 8px #ff2a55)';
        } else {
          rpmArc.style.stroke = '#00f0ff';
          rpmArc.style.filter = 'drop-shadow(0 0 6px #00f0ff)';
        }
      }

      // 2. Segmen Bar RPM di Bawah Dial
      const segs = document.querySelectorAll('#seg-wrapper .seg');
      const activeCount = Math.round(clampedRpm * segs.length);
      segs.forEach((el, index) => {
        el.classList.toggle('active', index < activeCount);
      });
    }

    /**
     * Mengatur persentase bensin (Radial Arc Gauge Kanan)
     * @param {number} fuel (0.0 sampai 1.0)
     */
    function setFuel(fuel) {
      const pct = Math.min(100, Math.max(0, Math.round(fuel * 100)));

      // 1. Update Radial Arc Fuel
      const fuelArc = document.getElementById('fuel-arc-bar');
      if (fuelArc) {
        fuelArc.style.strokeDashoffset = (100 * (1 - (pct / 100))).toFixed(2);
        if (pct <= 15) {
          fuelArc.style.stroke = '#ff2a55';
          fuelArc.style.filter = 'drop-shadow(0 0 8px #ff2a55)';
        } else {
          fuelArc.style.stroke = '#ff9d00';
          fuelArc.style.filter = 'drop-shadow(0 0 5px #ff9d00)';
        }
      }

      // 2. Update Teks Persentase
      const fuelVal = document.getElementById('fuel-val');
      if (fuelVal) fuelVal.innerText = `${pct}%`;

      // 3. Fallback compatibility
      const fuelBar = document.getElementById('fuel-bar');
      if (fuelBar) fuelBar.style.height = `${pct}%`;
    }

    /**
     * Mengatur persentase kondisi kendaraan / health (Radial Arc Gauge Kiri)
     * @param {number} health (0.0 sampai 1.0)
     */
    function setHealth(health) {
      const pct = Math.min(100, Math.max(0, Math.round(health * 100)));

      // 1. Update Radial Arc Health
      const healthArc = document.getElementById('health-arc-bar');
      if (healthArc) {
        healthArc.style.strokeDashoffset = (100 * (1 - (pct / 100))).toFixed(2);
        if (pct <= 25) {
          healthArc.style.stroke = '#ff3344';
          healthArc.style.filter = 'drop-shadow(0 0 8px #ff3344)';
        } else {
          healthArc.style.stroke = '#00f0ff';
          healthArc.style.filter = 'drop-shadow(0 0 5px #00f0ff)';
        }
      }

      // 2. Update Teks Persentase
      const healthVal = document.getElementById('health-val');
      if (healthVal) healthVal.innerText = `${pct}%`;

      // 3. Fallback compatibility
      const healthBar = document.getElementById('health-bar');
      if (healthBar) healthBar.style.height = `${pct}%`;
    }

    /**
     * Mengatur gear transmisi (0: R, 1, 2, 3...)
     * @param {number|string} gear
     */
    function setGear(gear) {
      const gearEl = document.getElementById('gear-label');
      if (!gearEl) return;
      
      if (gear === 0 || gear === '0' || gear === 'R') {
        gearEl.innerText = 'R';
        gearEl.style.color = '#ff3344';
      } else if (gear === 'N' || gear === 'P') {
        gearEl.innerText = String(gear);
        gearEl.style.color = '#00f0ff';
      } else {
        const g = Number(gear);
        gearEl.innerText = isNaN(g) ? String(gear) : `GEAR ${g}`;
        gearEl.style.color = '#ff9d00';
      }
    }

    /**
     * Mengatur indikator mesin (true: menyala hijau, false: mati)
     * @param {boolean} state
     */
    function setEngine(state) {
      const ico = document.getElementById('ico-engine');
      if (!ico) return;
      if (state) {
        ico.classList.add('fill-green');
      } else {
        ico.classList.remove('fill-green');
      }
    }

    /**
     * Mengatur lampu kendaraan (0: Off, 1: On, 2: High Beam)
     * @param {number} state
     */
    function setHeadlights(state) {
      const ico = document.getElementById('ico-lights');
      if (!ico) return;
      ico.classList.remove('fill-cyan', 'fill-blue');
      if (state === 2) {
        ico.classList.add('fill-blue');
      } else if (state > 0) {
        ico.classList.add('fill-cyan');
      }
    }

    /**
     * Indikator Sen Kiri (true: berkedip hijau)
     * @param {boolean} state
     */
    function setLeftIndicator(state) {
      const el = document.getElementById('ico-sen-left');
      if (!el) return;
      if (state) {
        el.classList.add('blinking');
      } else {
        el.classList.remove('blinking');
      }
    }

    /**
     * Indikator Sen Kanan (true: berkedip hijau)
     * @param {boolean} state
     */
    function setRightIndicator(state) {
      const el = document.getElementById('ico-sen-right');
      if (!el) return;
      if (state) {
        el.classList.add('blinking');
      } else {
        el.classList.remove('blinking');
      }
    }

    /**
     * Indikator Sabuk Pengaman (false: peringatan merah menyala)
     * @param {boolean} state
     */
    function setSeatbelts(state) {
      const ico = document.getElementById('ico-seatbelt');
      if (!ico) return;
      if (!state) {
        ico.classList.add('fill-red');
      } else {
        ico.classList.remove('fill-red');
      }
    }

    /**
     * Mengatur jarak tempuh / odometer digital
     * @param {number|string} distance
     */
    function setOdometer(distance) {
      const odo = document.getElementById('odometer');
      if (odo) odo.innerText = Number(distance).toFixed(1);
    }


    // ==============================================================
    // === SCRIPT TESTING BROWSER & SIMULASI AUTO-DRIVE =============
    // ==============================================================
    let testEngine = false;
    let testLights = 0;
    let testSeatbelt = false;
    let testSenLeft = false;
    let testSenRight = false;
    let testGearIndex = 1;
    const testGears = [0, 1, 2, 3, 4, 5, 6];
    let autoSimInterval = null;

    function toggleDemoPanel() {
      const p = document.getElementById('demo-panel');
      if (p) p.classList.toggle('show');
    }

    function onSpeedSlider(val) {
      const v = parseFloat(val);
      document.getElementById('demo-speed-val').innerText = `${v.toFixed(1)} m/s`;
      setSpeed(v);
    }

    function toggleEngineTest() {
      testEngine = !testEngine;
      setEngine(testEngine);
    }

    function cycleLightTest() {
      testLights = (testLights + 1) % 3;
      setHeadlights(testLights);
    }

    function toggleBeltTest() {
      testSeatbelt = !testSeatbelt;
      setSeatbelts(testSeatbelt);
    }

    function toggleLeftTest() {
      testSenLeft = !testSenLeft;
      setLeftIndicator(testSenLeft);
    }

    function toggleRightTest() {
      testSenRight = !testSenRight;
      setRightIndicator(testSenRight);
    }

    function cycleGearTest() {
      testGearIndex = (testGearIndex + 1) % testGears.length;
      setGear(testGears[testGearIndex]);
    }

    function cycleUnitTest() {
      const nextMode = (speedMode + 1) % 3;
      setSpeedMode(nextMode);
      onSpeedSlider(document.getElementById('range-speed').value);
    }

    // Shortcut Keyboard F2 untuk buka/tutup panel demo
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F2') {
        toggleDemoPanel();
      }
    });

    // Simulasi putaran gas, pergantian gear & kecepatan secara otomatis
    function toggleAutoDrive() {
      const btn = document.getElementById('btn-auto-sim');
      if (autoSimInterval) {
        clearInterval(autoSimInterval);
        autoSimInterval = null;
        btn.innerText = '▶ Auto Drive';
        btn.classList.remove('active');
        return;
      }

      btn.innerText = '⏹ Stop Sim';
      btn.classList.add('active');
      setEngine(true);
      setSeatbelts(true);

      let simSpeed = 0;
      let simRPM = 0.2;
      let simGear = 1;
      let accelerating = true;
      let odo = 142.0;

      autoSimInterval = setInterval(() => {
        if (accelerating) {
          simSpeed += 0.7;
          simRPM += 0.035;
          if (simRPM >= 0.95) {
            if (simGear < 6) {
              simGear++;
              simRPM = 0.45;
              setGear(simGear);
            } else {
              accelerating = false;
            }
          }
          if (simSpeed >= 70) accelerating = false;
        } else {
          simSpeed -= 1.2;
          simRPM = Math.max(0.15, simRPM - 0.04);
          if (simSpeed < 5) {
            simSpeed = 0;
            simGear = 1;
            accelerating = true;
            setGear(simGear);
          }
        }

        odo += (simSpeed * 0.0003);
        setSpeed(simSpeed);
        setRPM(simRPM);
        setOdometer(odo);

        // Update Slider UI
        document.getElementById('range-speed').value = simSpeed;
        document.getElementById('range-rpm').value = simRPM;
        document.getElementById('demo-speed-val').innerText = `${simSpeed.toFixed(1)} m/s`;
      }, 50);
    }

    // Inisialisasi status awal saat load
    setSeatbelts(false); // default warning sabuk menyala
    setHealth(1.0);
    setFuel(0.85);
    setOdometer(142.5);
    setGear(1);
    setSpeed(0);
    setRPM(0);
  </script>
</body>
</html>
