<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Speedometer JG:VRP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      width: 100vw;
    }

    /* Container HUD pojok kanan bawah */
    .hud-wrapper {
      position: absolute;
      bottom: 25px;
      right: 35px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }

    /* === BAR HEALTH & FUEL === */
    .bars-container {
      display: flex;
      gap: 8px;
    }

    .bar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .bar-label {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
    }

    .bar-track {
      width: 10px;
      height: 75px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      border-radius: 5px;
      transition: height 0.15s ease-out;
    }

    .health-fill {
      background: #00ffcc;
      box-shadow: 0 0 10px #00ffcc;
      height: 100%;
    }

    .fuel-fill {
      background: #ff9d00;
      box-shadow: 0 0 10px #ff9d00;
      height: 100%;
    }

    .bar-percent {
      font-size: 12px;
      font-weight: 700;
    }
    .health-txt { color: #00ffcc; }
    .fuel-txt { color: #ff9d00; }

    /* === SPEEDOMETER BLOCK === */
    .speed-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border-left: 2.5px solid #00f0ff;
      padding-left: 10px;
    }

    .top-indicator-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }

    .svg-icon {
      width: 15px;
      height: 15px;
      fill: rgba(255, 255, 255, 0.25);
      transition: fill 0.2s, filter 0.2s;
    }

    .speed-val {
      font-size: 60px;
      font-weight: 700;
      line-height: 0.85;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.85);
    }

    .speed-sub {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 4px;
    }

    .unit-val {
      font-size: 14px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .gear-val {
      font-size: 12px;
      font-weight: 700;
      color: #ff9d00;
      letter-spacing: 0.5px;
    }

    .mileage-val {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.5px;
    }

    /* Segmen Bar RPM */
    .segments {
      display: flex;
      gap: 3px;
      margin: 8px 0 6px 0;
    }

    .seg {
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: rgba(0, 240, 255, 0.18);
      transition: background 0.08s, box-shadow 0.08s;
    }

    .seg.active {
      background: #00f0ff;
      box-shadow: 0 0 6px #00f0ff;
    }

    .status-icons {
      display: flex;
      gap: 10px;
    }

    /* Kelas Warna Aktif */
    .fill-cyan { fill: #00f0ff !important; filter: drop-shadow(0 0 6px #00f0ff); }
    .fill-red { fill: #ff3344 !important; filter: drop-shadow(0 0 6px #ff3344); }
    .fill-green { fill: #00ff88 !important; filter: drop-shadow(0 0 6px #00ff88); }

    .blinking {
      animation: blink 0.5s infinite alternate ease-in-out;
      fill: #00ff88 !important;
      filter: drop-shadow(0 0 6px #00ff88);
    }

    @keyframes blink {
      0% { opacity: 0.15; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="hud-wrapper">
    <!-- Bar Vertikal -->
    <div class="bars-container">
      <div class="bar-item">
        <span class="bar-label">H</span>
        <div class="bar-track">
          <div class="bar-fill health-fill" id="health-bar"></div>
        </div>
        <span class="bar-percent health-txt" id="health-val">100%</span>
      </div>

      <div class="bar-item">
        <span class="bar-label">F</span>
        <div class="bar-track">
          <div class="bar-fill fuel-fill" id="fuel-bar"></div>
        </div>
        <span class="bar-percent fuel-txt" id="fuel-val">100%</span>
      </div>
    </div>

    <!-- Speedometer -->
    <div class="speed-block">
      <div class="top-indicator-row">
        <!-- Sen Kiri -->
        <svg class="svg-icon" id="ico-sen-left" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        
        <!-- Engine Status -->
        <svg class="svg-icon" id="ico-engine" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-2.42 1.08-4.6 2.79-6.07l-1.4-1.42A9.914 9.914 0 0 0 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-2.84-1.19-5.4-3.17-6.83z"/></svg>
        
        <!-- Sen Kanan -->
        <svg class="svg-icon" id="ico-sen-right" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </div>

      <div class="speed-val" id="speed">0</div>

      <div class="speed-sub">
        <span class="unit-val" id="unit-label">MPH</span>
        <span class="gear-val" id="gear-label">GEAR 1</span>
        <span class="mileage-val"><span id="odometer">0.0</span> MI</span>
      </div>

      <!-- Segmen Bar RPM -->
      <div class="segments" id="seg-wrapper">
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
      </div>

      <!-- Baris Status Ikon -->
      <div class="status-icons">
        <svg class="svg-icon" id="ico-seatbelt" viewBox="0 0 24 24"><path d="M16 3H8C6.9 3 6 3.9 6 5v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 4.5l-3.5 3.5 3.5 3.5V16l-5-5 5-5v1.5z"/></svg>
        <svg class="svg-icon" id="ico-lights" viewBox="0 0 24 24"><path d="M12 2C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm-2 18h4v1h-4v-1zm-1 3h6v1H9v-1z"/></svg>
      </div>
    </div>
  </div>

  <script>
    let speedMode = 1; // 0: KMH, 1: MPH, 2: Knots
    const segElements = document.querySelectorAll('#seg-wrapper .seg');

    // === FUNGSI BAWAAN RESMI DARI DEV JG:VRP ===

    function setSpeedMode(mode) {
      speedMode = mode;
      const unitEl = document.getElementById('unit-label');
      switch(mode) {
        case 1: unitEl.innerText = 'MPH'; break;
        case 2: unitEl.innerText = 'KNOTS'; break;
        default: unitEl.innerText = 'KMH';
      }
    }

    function setSpeed(speed) {
      let finalSpeed = 0;
      switch(speedMode) {
        case 1: finalSpeed = Math.round(speed * 2.236936); break;
        case 2: finalSpeed = Math.round(speed * 1.943844); break;
        default: finalSpeed = Math.round(speed * 3.6);
      }
      document.getElementById('speed').innerText = finalSpeed;
    }

    function setRPM(rpm) {
      // rpm dikirim nilai 0 sampai 1
      const activeCount = Math.round(rpm * segElements.length);
      segElements.forEach((el, index) => {
        el.classList.toggle('active', index < activeCount);
      });
    }

    function setFuel(fuel) {
      // fuel 0 sampai 1
      const pct = Math.min(100, Math.max(0, Math.round(fuel * 100)));
      document.getElementById('fuel-bar').style.height = `${pct}%`;
      document.getElementById('fuel-val').innerText = `${pct}%`;
    }

    function setHealth(health) {
      // health 0 sampai 1
      const pct = Math.min(100, Math.max(0, Math.round(health * 100)));
      document.getElementById('health-bar').style.height = `${pct}%`;
      document.getElementById('health-val').innerText = `${pct}%`;
    }

    function setGear(gear) {
      const g = Number(gear);
      document.getElementById('gear-label').innerText = g === 0 ? 'R' : `GEAR ${g}`;
    }

    function setEngine(state) {
      const ico = document.getElementById('ico-engine');
      if (state) {
        ico.classList.add('fill-green');
      } else {
        ico.classList.remove('fill-green');
      }
    }

    function setHeadlights(state) {
      // 0: Off, 1: On, 2: High Beam
      const ico = document.getElementById('ico-lights');
      if (state > 0) {
        ico.classList.add('fill-cyan');
      } else {
        ico.classList.remove('fill-cyan');
      }
    }

    function setLeftIndicator(state) {
      const el = document.getElementById('ico-sen-left');
      if (state) {
        el.classList.add('blinking');
      } else {
        el.classList.remove('blinking');
      }
    }

    function setRightIndicator(state) {
      const el = document.getElementById('ico-sen-right');
      if (state) {
        el.classList.add('blinking');
      } else {
        el.classList.remove('blinking');
      }
    }

    function setSeatbelts(state) {
      // Merah menyala jika belum pasang sabuk (state false)
      const ico = document.getElementById('ico-seatbelt');
      if (!state) {
        ico.classList.add('fill-red');
      } else {
        ico.classList.remove('fill-red');
      }
    }

    function setOdometer(distance) {
      document.getElementById('odometer').innerText = Number(distance).toFixed(1);
    }
  </script>
</body>
</html>
