<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JG:VRP Custom Speedometer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      width: 100vw;
    }

    /* Container HUD pojok kanan bawah */
    .hud-wrapper {
      position: absolute;
      bottom: 25px;
      right: 35px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }

    .hidden {
      display: none !important;
    }

    /* === BAR HEALTH & FUEL === */
    .bars-container {
      display: flex;
      gap: 8px;
    }

    .bar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .bar-label {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
    }

    .bar-track {
      width: 10px;
      height: 75px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      border-radius: 5px;
      transition: height 0.15s ease-out;
    }

    .health-fill {
      background: #00ffcc;
      box-shadow: 0 0 10px #00ffcc;
      height: 100%;
    }

    .fuel-fill {
      background: #ff9d00;
      box-shadow: 0 0 10px #ff9d00;
      height: 100%;
    }

    .bar-percent {
      font-size: 12px;
      font-weight: 700;
    }
    .health-txt { color: #00ffcc; }
    .fuel-txt { color: #ff9d00; }

    /* === SPEEDOMETER BLOCK === */
    .speed-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border-left: 2.5px solid #00f0ff;
      padding-left: 10px;
    }

    .top-indicator-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }

    .svg-icon {
      width: 15px;
      height: 15px;
      fill: rgba(255, 255, 255, 0.25);
      transition: fill 0.2s, filter 0.2s;
    }

    .speed-val {
      font-size: 60px;
      font-weight: 700;
      line-height: 0.85;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.85);
    }

    .speed-sub {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 4px;
    }

    .unit-val {
      font-size: 14px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .mileage-val {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.5px;
    }

    /* Segmen Bar RPM */
    .segments {
      display: flex;
      gap: 3px;
      margin: 8px 0 6px 0;
    }

    .seg {
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: rgba(0, 240, 255, 0.18);
      transition: background 0.1s, box-shadow 0.1s;
    }

    .seg.active {
      background: #00f0ff;
      box-shadow: 0 0 6px #00f0ff;
    }

    .status-icons {
      display: flex;
      gap: 10px;
    }

    /* Kelas Warna Aktif */
    .fill-cyan { fill: #00f0ff !important; filter: drop-shadow(0 0 6px #00f0ff); }
    .fill-red { fill: #ff3344 !important; filter: drop-shadow(0 0 6px #ff3344); }
    .fill-green { fill: #00ff88 !important; filter: drop-shadow(0 0 6px #00ff88); }

    .blinking {
      animation: blink 0.5s infinite alternate ease-in-out;
      fill: #00ff88 !important;
      filter: drop-shadow(0 0 6px #00ff88);
    }

    @keyframes blink {
      0% { opacity: 0.15; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="hud-wrapper" id="speedo-container">
    <!-- Bar Vertikal -->
    <div class="bars-container">
      <div class="bar-item">
        <span class="bar-label">H</span>
        <div class="bar-track">
          <div class="bar-fill health-fill" id="health-bar"></div>
        </div>
        <span class="bar-percent health-txt" id="health-val">100%</span>
      </div>

      <div class="bar-item">
        <span class="bar-label">F</span>
        <div class="bar-track">
          <div class="bar-fill fuel-fill" id="fuel-bar"></div>
        </div>
        <span class="bar-percent fuel-txt" id="fuel-val">100%</span>
      </div>
    </div>

    <!-- Speedometer -->
    <div class="speed-block">
      <div class="top-indicator-row">
        <!-- Sen Kiri -->
        <svg class="svg-icon" id="ico-sen-left" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        
        <!-- Lock -->
        <svg class="svg-icon" id="ico-lock" viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6-5c1.66 0 3 1.34 3 3v2H9V6c0-1.66 1.34-3 3-3z"/></svg>
        
        <!-- Sen Kanan -->
        <svg class="svg-icon" id="ico-sen-right" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </div>

      <div class="speed-val" id="speed">0</div>

      <div class="speed-sub">
        <span class="unit-val" id="speed-unit">MPH</span>
        <span class="mileage-val"><span id="mileage">00000</span> MI</span>
      </div>

      <!-- Segmen RPM -->
      <div class="segments" id="seg-wrapper">
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
      </div>

      <!-- Baris Status Ikon -->
      <div class="status-icons">
        <svg class="svg-icon" id="ico-seatbelt" viewBox="0 0 24 24"><path d="M16 3H8C6.9 3 6 3.9 6 5v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 4.5l-3.5 3.5 3.5 3.5V16l-5-5 5-5v1.5z"/></svg>
        <svg class="svg-icon" id="ico-engine" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-2.42 1.08-4.6 2.79-6.07l-1.4-1.42A9.914 9.914 0 0 0 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-2.84-1.19-5.4-3.17-6.83z"/></svg>
        <svg class="svg-icon" id="ico-lights" viewBox="0 0 24 24"><path d="M12 2C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm-2 18h4v1h-4v-1zm-1 3h6v1H9v-1z"/></svg>
        <svg class="svg-icon" id="ico-handbrake" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
      </div>
    </div>
  </div>

  <script>
    const segElements = document.querySelectorAll('#seg-wrapper .seg');

    window.addEventListener('message', (event) => {
      let raw = event.data;
      if (!raw) return;

      // Unpack jika JG:VRP mengirim payload di dalam "message"
      const item = (raw.message && typeof raw.message === 'object') ? raw.message : raw;

      // Sembunyikan/munculkan HUD otomatis saat naik/turun kendaraan
      if (raw.type === "Speedo" && raw.show !== undefined) {
        document.getElementById('speedo-container').classList.toggle('hidden', !raw.show);
      } else if (item.show !== undefined) {
        document.getElementById('speedo-container').classList.toggle('hidden', !item.show);
      }

      // 1. Kecepatan (Speed)
      const spd = item.speed ?? item.speedo ?? item.curSpeed;
      if (spd !== undefined) {
        document.getElementById('speed').innerText = Math.round(spd);
      }

      // 2. Unit Satuan
      if (item.unit) {
        document.getElementById('speed-unit').innerText = item.unit.toUpperCase();
      }

      // 3. Fuel (Bensin)
      const fuelVal = item.fuel ?? item.gas;
      if (fuelVal !== undefined) {
        const roundedFuel = Math.min(100, Math.max(0, Math.round(fuelVal)));
        document.getElementById('fuel-bar').style.height = `${roundedFuel}%`;
        document.getElementById('fuel-val').innerText = `${roundedFuel}%`;
      }

      // 4. Kondisi Mesin / Health
      let healthVal = item.health ?? item.engineHealth;
      if (healthVal !== undefined) {
        if (healthVal > 100) healthVal = (healthVal / 1000) * 100;
        const roundedHealth = Math.min(100, Math.max(0, Math.round(healthVal)));
        document.getElementById('health-bar').style.height = `${roundedHealth}%`;
        document.getElementById('health-val').innerText = `${roundedHealth}%`;
      }

      // 5. RPM Segments
      if (item.rpm !== undefined) {
        const activeCount = Math.round(item.rpm * segElements.length);
        segElements.forEach((el, index) => {
          el.classList.toggle('active', index < activeCount);
        });
      }

      // 6. Mileage / Total Jarak
      const miles = item.mileage ?? item.odometer ?? item.distance;
      if (miles !== undefined) {
        document.getElementById('mileage').innerText = Math.round(miles).toString().padStart(5, '0');
      }

      // 7. Lampu Sen
      const leftSig = item.indicatorLeft || item.signalLeft || (item.indicators && item.indicators.left);
      const rightSig = item.indicatorRight || item.signalRight || (item.indicators && item.indicators.right);
      toggleBlink('ico-sen-left', leftSig);
      toggleBlink('ico-sen-right', rightSig);

      // 8. Lock / Unlock Kendaraan
      const isLocked = item.locked ?? item.isLocked ?? (item.doorLockStatus === 2);
      if (isLocked !== undefined) {
        toggleColor('ico-lock', isLocked, 'fill-red', 'fill-green');
      }

      // 9. Mesin Hidup / Mati
      const isEngineOn = item.engine ?? item.engineRunning;
      if (isEngineOn !== undefined) {
        toggleColor('ico-engine', isEngineOn, 'fill-green');
      }

      // 10. Lampu Utama
      const lightsOn = item.lights || item.headlights || (item.lightState && item.lightState > 0);
      if (lightsOn !== undefined) {
        toggleColor('ico-lights', lightsOn, 'fill-cyan');
      }

      // 11. Seatbelt
      if (item.seatbelt !== undefined) {
        toggleColor('ico-seatbelt', !item.seatbelt, 'fill-red');
      }

      // 12. Handbrake
      if (item.handbrake !== undefined) {
        toggleColor('ico-handbrake', item.handbrake, 'fill-red');
      }
    });

    function toggleColor(id, condition, activeClass, inactiveClass = '') {
      const el = document.getElementById(id);
      if (!el) return;
      if (condition) {
        el.classList.add(activeClass);
        if (inactiveClass) el.classList.remove(inactiveClass);
      } else {
        el.classList.remove(activeClass);
        if (inactiveClass) el.classList.add(inactiveClass);
      }
    }

    function toggleBlink(id, condition) {
      const el = document.getElementById(id);
      if (!el) return;
      if (condition) {
        el.classList.add('blinking');
      } else {
        el.classList.remove('blinking');
      }
    }
  </script>
</body>
</html>
